name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy concorrente por vez
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Build dos arquivos de produção com Vite (dist)
        run: |
          npm run build
          # Evita que o Jekyll ignore arquivos estáticos no GitHub Pages
          touch dist/.nojekyll
          # Fallback SPA para rotas e recarregamento sem erro 404
          cp dist/index.html dist/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato de produção (pasta dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
